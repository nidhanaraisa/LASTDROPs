  <title>LASTDROP Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading LASTDROP Prototype...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"dd41d831-7463-48aa-8831-28fe26602f4f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;font-family:'Open Sauce','Open Sauce One','Figtree',system-ui,sans-serif}\nsc-if,sc-for{display:contents}\nbutton{font-family:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ff9f6b;outline-offset:2px}\n.app{background:var(--bg);color:var(--ink);min-height:1700px;font-size:16px;line-height:1.55}\n.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}\n.btn{min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:700;font-size:15px}\n.btn:hover{filter:brightness(.92)}\n.btn2{min-height:48px;padding:0 20px;border:2px solid var(--teal);border-radius:10px;background:transparent;color:var(--head);font-weight:700;font-size:15px}\n.btnh{min-height:48px;padding:0 22px;border:2px solid #faf6ee;border-radius:10px;background:transparent;color:#faf6ee;font-weight:700;font-size:15px}\n.chip{min-height:44px;padding:0 16px;border-radius:8px;font-weight:600;font-size:15px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--teal);border-color:var(--teal);color:#fff}\n.tab{min-height:46px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}\n.tab[aria-current=\"true\"]{color:var(--head);border-bottom-color:var(--teal);font-weight:700}\n.logobtn{border:0;background:transparent;padding:0;min-height:44px;display:flex;align-items:center;gap:10px}\n.inp{min-height:46px;padding:0 14px;border:1.5px solid var(--line2);border-radius:8px;font-size:16px;font-family:inherit;box-sizing:border-box;width:100%;background:var(--surface);color:var(--ink)}\ntextarea.inp{padding:12px 14px;resize:vertical}\n.lbl{font-weight:600;font-size:14px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-sizing:border-box}\n.field{display:flex;flex-direction:column;gap:6px;min-width:0}\n.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;display:inline-block}\n.tag-ai{background:var(--orangeBg);color:var(--orangeInk);border:1px solid #ff9f6b}\n.tag-ok{background:var(--mintBg);color:var(--head)}\n.tag-mute{background:var(--surface2);color:var(--muted)}\n.h1{font-size:clamp(34px,4.6vw,52px);font-weight:800;line-height:1.05;letter-spacing:-0.02em;margin:0}\n.h2{font-size:26px;font-weight:800;color:var(--head);margin:0;line-height:1.15;letter-spacing:-0.01em}\n.h3{font-size:19px;font-weight:700;color:var(--head);margin:0;line-height:1.25}\n.muted{color:var(--muted)}\n.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}\n.step{display:flex;align-items:center;gap:10px}\n.dot{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--surface2);color:var(--muted)}\n.step[data-s=\"done\"] .dot{background:var(--teal);color:#fff}\n.step[data-s=\"now\"] .dot{background:#ff9f6b;color:#1c2120}\n.step[data-s=\"bad\"] .dot{background:#ff9f6b;color:#1c2120}\n.step[data-s=\"now\"] .st{color:var(--ink);font-weight:700}\n.st{font-size:14px;color:var(--muted)}\n.mk{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}\n.mk-ok{background:var(--teal)}\n.mk-warn{background:#ff9f6b;color:#1c2120}\n.row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}\n.time{font-weight:700;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:4px}\n.time-u{background:var(--orangeBg);color:var(--orangeInk)}\n.time-c{background:var(--mintBg);color:var(--head)}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"app\" style=\"--bg: {{c.bg}}; --surface: {{c.surface}}; --surface2: {{c.surface2}}; --ink: {{c.ink}}; --muted: {{c.muted}}; --line: {{c.line}}; --line2: {{c.line2}}; --head: {{c.head}}; --teal: {{c.teal}}; --mintBg: {{c.mintBg}}; --orangeBg: {{c.orangeBg}}; --orangeInk: {{c.orangeInk}}; --badge: {{c.badge}}\" data-canvas-width=\"1280\" data-canvas-height=\"1700\" data-document-role=\"page\" data-label=\"LASTDROP Prototype\">\n\n<header style=\"border-bottom: 1px solid var(--line); background: var(--bg)\">\n<div class=\"wrap\" style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; padding-bottom: 10px\">\n<button class=\"logobtn\" sc-camel-on-click=\"{{goHome}}\" aria-label=\"LASTDROP, ke beranda\">\n<span style=\"background: var(--badge); border-radius: 10px; padding: 4px 8px; display: inline-flex\"><img src=\"889bb327-86b5-4e72-b07a-9a87d00fbee9\" alt=\"\" style=\"height: 34px; width: auto\"><\u002Fspan>\n<span style=\"font-weight: 800; font-size: 23px; letter-spacing: 0.01em; color: var(--head)\">LASTDROP.<\u002Fspan>\n<\u002Fbutton>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<sc-if value=\"{{loggedIn}}\" hint-placeholder-val=\"{{ false }}\">\n<span class=\"tag tag-ok\" style=\"font-size: 13px; padding: 6px 12px\">{{roleBadge}}<\u002Fspan>\n<div style=\"position: relative\">\n<button class=\"chip\" sc-camel-on-click=\"{{toggleNotif}}\" aria-expanded=\"{{notifOpen}}\">Notifikasi · {{notifCount}}<\u002Fbutton>\n<sc-if value=\"{{notifOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; right: 0; top: 52px; z-index: 5; width: 320px; max-width: calc(100vw - 48px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18)\">\n<sc-for list=\"{{notifs}}\" as=\"n\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-direction: column; padding-bottom: 10px; border-bottom: 1px solid var(--line)\"><strong style=\"font-size: 15px\">{{n.title}}<\u002Fstrong><span class=\"muted\" style=\"font-size: 14px\">{{n.text}}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<button class=\"chip\" sc-camel-on-click=\"{{toggleTheme}}\">{{themeLabel}}<\u002Fbutton>\n<sc-if value=\"{{loggedIn}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn2\" sc-camel-on-click=\"{{logout}}\">Keluar<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{showPublicAuth}}\" hint-placeholder-val=\"{{ true }}\">\n<button class=\"btn2\" sc-camel-on-click=\"{{goLogin}}\">Masuk<\u002Fbutton>\n<button class=\"btn\" sc-camel-on-click=\"{{goRegister}}\">Daftar<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{loggedIn}}\" hint-placeholder-val=\"{{ false }}\">\n<nav class=\"wrap\" aria-label=\"Fitur sesuai peran\" style=\"display: flex; flex-wrap: wrap; gap: 4px; padding-top: 0; padding-bottom: 0\">\n<sc-for list=\"{{tabs}}\" as=\"tb\" hint-placeholder-count=\"5\">\n<button class=\"tab\" aria-current=\"{{tb.active}}\" sc-camel-on-click=\"{{tb.pick}}\"><sc-if value=\"{{tb.hasNum}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"dot\" style=\"width: 24px; height: 24px; font-size: 12px\">{{tb.num}}<\u002Fspan><\u002Fsc-if>{{tb.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fnav>\n<\u002Fsc-if>\n<\u002Fheader>\n\n<main>\n\n<!-- LANDING -->\n<sc-if value=\"{{vLanding}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"wrap\" style=\"padding-top: 40px; padding-bottom: 8px\">\n<div style=\"background: #164e63; color: #faf6ee; border-radius: 16px; padding: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 32px\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<span class=\"eyebrow\" style=\"color: #adebb3\">Smart Food Management<\u002Fspan>\n<h1 class=\"h1\">Every Drop Counts.<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; max-width: 520px; color: #e6efe9\">Turn surplus food into valuable opportunities. Platform B2B2C yang mempertemukan supplier surplus pangan dengan usaha lain dan konsumen.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button class=\"btn\" sc-camel-on-click=\"{{goRegister}}\">Explore Now →<\u002Fbutton>\n<button class=\"btnh\" sc-camel-on-click=\"{{goLogin}}\">Masuk<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 0 1 260px; background: #faf6ee; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: center\"><img src=\"cb02271e-1c48-4fc0-8a3f-a3ea0d1d7fbb\" alt=\"Logo LASTDROP\" style=\"width: 100%; max-width: 210px; height: auto\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"wrap\" style=\"padding-top: 16px; padding-bottom: 8px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<div class=\"card\" style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px\"><span class=\"muted\" style=\"font-size: 14px\">Total Products<\u002Fspan><strong style=\"font-size: 36px; color: var(--head); line-height: 1.1\">128<\u002Fstrong><span class=\"muted\" style=\"font-size: 13px\">Contoh data prototype<\u002Fspan><\u002Fdiv>\n<div class=\"card\" style=\"flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px\"><span class=\"muted\" style=\"font-size: 14px\">Near Expiry<\u002Fspan><strong style=\"font-size: 36px; color: var(--head); line-height: 1.1\">12<\u002Fstrong><span class=\"muted\" style=\"font-size: 13px\">Contoh data prototype<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #adebb3; color: #164e63; border-radius: 10px; padding: 12px 18px; font-weight: 600\">Sustainable food, smarter future.<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"wrap\" style=\"padding-top: 56px; display: flex; flex-direction: column; gap: 24px\">\n<h2 class=\"h2\">Dua jalur, satu platform<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div class=\"card\" style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\" style=\"color: var(--head)\">Supplier journey<\u002Fspan>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{supSteps}}\" as=\"st\" hint-placeholder-count=\"6\"><li class=\"step\" style=\"align-items: flex-start\"><span class=\"dot\">{{st.n}}<\u002Fspan><span style=\"padding-top: 3px\">{{st.text}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<button class=\"btn\" sc-camel-on-click=\"{{regSupplier}}\" style=\"align-self: flex-start\">Daftar sebagai supplier<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"card\" style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<span class=\"eyebrow\" style=\"color: var(--head)\">Customer journey<\u002Fspan>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{buySteps}}\" as=\"st\" hint-placeholder-count=\"6\"><li class=\"step\" style=\"align-items: flex-start\"><span class=\"dot\">{{st.n}}<\u002Fspan><span style=\"padding-top: 3px\">{{st.text}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<button class=\"btn\" sc-camel-on-click=\"{{regBuyer}}\" style=\"align-self: flex-start\">Daftar sebagai customer<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"wrap\" style=\"padding-top: 56px; padding-bottom: 72px; display: flex; flex-direction: column; gap: 8px\">\n<h2 class=\"h2\" style=\"margin-bottom: 12px\">Fitur unggulan<\u002Fh2>\n<sc-for list=\"{{features}}\" as=\"f\" hint-placeholder-count=\"5\">\n<div class=\"row\">\n<strong style=\"flex: 1 1 220px; font-size: 19px; color: var(--head)\">{{f.name}}<\u002Fstrong>\n<span style=\"flex: 3 1 340px; min-width: 0\">{{f.desc}}<\u002Fspan>\n<span class=\"tag tag-mute\" style=\"flex: none\">{{f.user}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<p class=\"muted\" style=\"margin: 12px 0 0\">Fitur pendukung: notifikasi, kode referral, dan promo flash sale.<\u002Fp>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- REGISTER -->\n<sc-if value=\"{{vRegister}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"wrap\" style=\"padding-top: 40px; padding-bottom: 72px; display: flex; flex-wrap: wrap; gap: 32px; align-items: stretch\">\n<aside style=\"flex: 1 1 340px; min-width: 0; background: #164e63; color: #faf6ee; border-radius: 16px; padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px\">\n<span class=\"eyebrow\" style=\"color: #adebb3\">Langkah 1 · Registrasi<\u002Fspan>\n<h1 class=\"h2\" style=\"color: #faf6ee; font-size: 32px\">{{regTitle}}<\u002Fh1>\n<p style=\"margin: 0; color: #e6efe9\">{{regIntro}}<\u002Fp>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{regSteps}}\" as=\"st\" hint-placeholder-count=\"5\"><li style=\"display: flex; gap: 12px\"><span class=\"dot\" style=\"background: #adebb3; color: #164e63\">{{st.n}}<\u002Fspan><span style=\"padding-top: 3px\">{{st.text}}<\u002Fspan><\u002Fli><\u002Fsc-for>\n<\u002Fol>\n<\u002Faside>\n<div class=\"card\" style=\"flex: 1 1 460px; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 20px\">\n<div role=\"group\" aria-label=\"Pilih peran\" style=\"display: flex; gap: 8px\">\n<button class=\"chip\" aria-pressed=\"{{isSup}}\" sc-camel-on-click=\"{{pickSup}}\">Supplier<\u002Fbutton>\n<button class=\"chip\" aria-pressed=\"{{isBuy}}\" sc-camel-on-click=\"{{pickBuy}}\">Customer<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"field\"><label class=\"lbl\" for=\"rg-name\">Nama lengkap<\u002Flabel><input id=\"rg-name\" class=\"inp\" type=\"text\" value=\"{{regName}}\" sc-camel-on-input=\"{{onRegName}}\" placeholder=\"Nama Anda\"><\u002Fdiv>\n<div class=\"field\"><label class=\"lbl\" for=\"rg-email\">Email<\u002Flabel><input id=\"rg-email\" class=\"inp\" type=\"email\" value=\"{{regEmail}}\" sc-camel-on-input=\"{{onRegEmail}}\" placeholder=\"nama@email.com\"><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<div class=\"field\" style=\"flex: 1 1 200px\"><label class=\"lbl\" for=\"rg-pass\">Kata sandi<\u002Flabel><input id=\"rg-pass\" class=\"inp\" type=\"password\" value=\"{{regPass}}\" sc-camel-on-input=\"{{onRegPass}}\" placeholder=\"Minimal 8 karakter\"><\u002Fdiv>\n<div class=\"field\" style=\"flex: 1 1 200px\"><label class=\"lbl\" for=\"rg-ref\">Kode referral (opsional)<\u002Flabel><input id=\"rg-ref\" class=\"inp\" type=\"text\" value=\"{{regRef}}\" sc-camel-on-input=\"{{onRegRef}}\" placeholder=\"Contoh: LASTDROP10\"><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{regErr}}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-weight: 600; color: var(--orangeInk)\">Isi nama dan email dulu.<\u002Fspan><\u002Fsc-if>\n<button class=\"btn\" sc-camel-on-click=\"{{submitReg}}\" style=\"min-height: 52px\">{{regButton}}<\u002Fbutton>\n<button class=\"btn2\" sc-camel-on-click=\"{{goLogin}}\" style=\"border-color: var(--line2); font-weight: 600\">Sudah punya akun? Masuk<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- SUPPLIER DATA -->\n<sc-if value=\"{{vData}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"wrap\"
